# Homa lab: four Linux hosts running the Homa transport protocol as an out-of-tree kernel module (PlatformLab/HomaModule),
# joined by a Linux switch VM (sw1) whose egress ports model a datacenter switch: a rate limit (the bottleneck) and 8 strict
# priority queues selected by the top 3 bits of DSCP / the IPv6 traffic class, which is where Homa writes its priority.
#
#   h1 eth1 --- eth1 ┐
#   h2 eth1 --- eth2 ├ sw1 (Linux bridge br0; per-port egress: htb rate -> prio 8 bands | single fifo | no shaping)
#   h3 eth1 --- eth3 │
#   h4 eth1 --- eth4 ┘
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LIBVIRT_URI="qemu:///system"

# Base image (tools/build_image.sh): Ubuntu 26.04 cloud image + the mainline 6.17.8 kernel (kernel.ubuntu.com/mainline, the
# version HomaModule's main branch is developed against) + homa.ko and HomaModule's util/ programs built against it.
UBUNTU_IMAGE_URL="https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img"
KERNEL_MAINLINE="v6.17.8"
KERNEL_RELEASE="6.17.8-061708-generic"     # uname -r inside the VMs
HOMA_REPO="https://github.com/PlatformLab/HomaModule.git"
HOMA_COMMIT="65cecd7831e8b24ba7bcd967288bb7ce26fe8eba"   # main, 2026-10-08
BASE_IMAGE="$LAB_DIR/images/homa-base.qcow2"
BASE_DISK_GB=12
BUILDER_NET="default"                     # the image builder VM needs the internet (libvirt NAT)

# Out-of-band management network (isolated libvirt bridge; the host is the gateway). eth0 on every VM.
OOB_NET="homa-oob"
OOB_GATEWAY="10.8.0.1"

# Data network: one L2 segment through sw1 (Linux bridge br0), MTU 9000 (Homa's recommendation)
DATA_PREFIX4="192.168.80.0/24"
DATA_PREFIX6="fd00:80::/64"
DATA_MTU=9000

HOSTS=(h1 h2 h3 h4)
SWITCH=sw1
ALL_NODES=("${HOSTS[@]}" "$SWITCH")
declare -A ROLE=(         [h1]=host [h2]=host [h3]=host [h4]=host [sw1]=switch )
declare -A MGMT_IP=(      [h1]=10.8.0.11 [h2]=10.8.0.12 [h3]=10.8.0.13 [h4]=10.8.0.14 [sw1]=10.8.0.20 )
declare -A DATA_IP=(      [h1]=192.168.80.11 [h2]=192.168.80.12 [h3]=192.168.80.13 [h4]=192.168.80.14 )
declare -A DATA_IP6=(     [h1]=fd00:80::11 [h2]=fd00:80::12 [h3]=fd00:80::13 [h4]=fd00:80::14 )
declare -A SW_PORT=(      [h1]=1 [h2]=2 [h3]=3 [h4]=4 )          # host -> sw1 port (eth<N>)
declare -A NODE_IDX=(     [h1]=1 [h2]=2 [h3]=3 [h4]=4 [sw1]=5 )
declare -A CONSOLE_PORT=( [h1]=5701 [h2]=5702 [h3]=5703 [h4]=5704 [sw1]=5705 )
declare -A VCPU=(         [h1]=2 [h2]=2 [h3]=2 [h4]=2 [sw1]=2 )
declare -A RAM_MIB=(      [h1]=2048 [h2]=2048 [h3]=2048 [h4]=2048 [sw1]=1024 )
BUILDER_VCPU=4
BUILDER_RAM_MIB=4096
BUILDER_CONSOLE=5709
SW_PORTS=4

MAC_OUI="52:54:00:cb"     # MACs 52:54:00:cb:<idx>:<port> (hex); srv6-core :c6, cat8000v-ipsec :c7, vyos-dmvpn :c8, :c9, :ca taken
# Links: one isolated libvirt bridge per host <-> sw1 link (networks/homa-link<port>.xml, no addresses, MTU 9000). Not UDP
# tunnels as in the other labs: QEMU's UDP socket backend keeps the host's default 208 KB receive buffer, and Homa's bursts
# of 9 KB frames overflowed it (host UdpRcvbufErrors) — losses no counter in the lab could see.

# sw1 egress policy applied at boot (sw-qos): mode prio|fifo|off, the per-port rate (the bottleneck), the queue size per band
SW_QOS_MODE="prio"
SW_QOS_RATE="1gbit"
SW_QOS_LIMIT=200          # packets per queue (x 9000 bytes)

# Homa on the hosts: loaded at boot (/etc/modules-load.d), homa_prio running (systemd unit homa-prio), these sysctls set
# (/etc/sysctl.d/90-homa.conf; link_mbps = the bottleneck sw1 enforces, so Homa's pacer and grants size for it — the default
# assumes 25 Gbit/s), and the standing test servers: homa-echo (:4100), homa-echo6 (:4101), cp-homa (:4000), cp-tcp (:5000), and
# for latency probes cp-homa-probe (:4010), cp-tcp-probe (:5010)
HOMA_PRIO=1
HOMA_SYSCTL=( "link_mbps=1000" )
HOST_SERVICES=(homa-echo homa-echo6 cp-homa cp-tcp cp-homa-probe cp-tcp-probe)
